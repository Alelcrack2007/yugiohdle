<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YugiohEdle - Guess the Yu-Gi-Oh! Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-overlay"></div>

  <header>
    <h1>YugiohEdle</h1>
    <p class="subtitle">Guess the Yu-Gi-Oh! Card</p>
  </header>

  <!-- Mode Selector -->
  <div class="mode-selector">
    <button onclick="setMode('monster')" class="mode-btn" id="btn-monster">Monster Mode</button>
    <button onclick="setMode('card')" class="mode-btn active" id="btn-card">All Cards Mode</button>
    <button onclick="setMode('infinite')" class="mode-btn" id="btn-infinite">Infinite Mode</button>
  </div>

  <div class="input-container">
    <p id="triesLeft">Attempts left: 10</p>
    <input list="cardList" id="guessInput" placeholder="Type card name..." autocomplete="off">
    <button class="main-btn" onclick="submitGuess()">Submit Guess</button>
    <button class="main-btn secondary" onclick="startNewGame()">New Game</button>
  </div>

  <datalist id="cardList"></datalist>

  <!-- Results Table -->
  <div id="results" class="result-table"></div>

  <!-- Zoom Modal -->
  <div id="zoomModal" class="zoom-modal hidden">
    <div class="zoom-wrapper">
      <img id="zoomedImage" src="" alt="Card Image">
    </div>
  </div>

  <footer class="credits">
    © 2026 YugiohEdle<br>
    Powered by <a href="https://db.ygoprodeck.com/" target="_blank">YGOPRODeck API</a> • 
    Fork of yichengxia's yugioh-guess
    Inspired by pokemonle & Wordle
  </footer>

  <script src="script.js"></script>
</body>
</html>
